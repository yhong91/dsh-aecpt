name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check index.js
          node --check binding.js
          node --check prompts.js
          node --check feeds.js
          node --check library.js
          node --check store.js
          node --check diff3.js
          node --check build-client.js

      - name: Build client bundle
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Check npm tarball contents
        run: npm pack --dry-run
